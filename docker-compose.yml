version: '3.8'

services:

  app:
    build:
      context: .
    container_name: merchant-backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - docker.env
    environment:
      NODE_ENV: production
      PORT: 4000
    ports:
      - "4000:4000"

  db:
    image: postgres:14
    container_name: postgres-merchant
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
      POSTGRES_DB: merchant
    volumes:
      - postgres:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres:
    name: merchant-db
